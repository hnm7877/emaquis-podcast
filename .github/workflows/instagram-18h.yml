# Instagram ne permet pas la publication programmée par l'API :
# ce job publie à 18:00 UTC (mardi à samedi) les Reels dont le créneau est arrivé.
name: Instagram 18h
on:
  schedule:
    - cron: "58 17 * * 2-6"
  workflow_dispatch:
permissions:
  contents: write
concurrency: shorts
jobs:
  instagram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests PyYAML
      - name: Publier les Reels du jour
        env: { TREG_TOKEN: "${{ secrets.TREG_TOKEN }}" }
        run: python social_publish.py --instagram-due
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -f state.json
          git commit -m "Instagram : état de publication" || true
          git pull -q --rebase origin main || true
          git push
