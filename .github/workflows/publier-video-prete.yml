# Bouton manuel : publie tout de suite une vidéo déjà montée (pub, vidéo spéciale) sur YouTube, Facebook et TikTok.
name: Publier une vidéo prête
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Identifiant dans shorts.yaml (ex. pub-pos)"
        required: true
      fichier:
        description: "Chemin de la vidéo dans le dépôt (ex. assets/pub-pos/pub-pos-9x16.mp4)"
        required: true
permissions:
  contents: write
concurrency: shorts
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq ffmpeg || true
      - run: pip install -q -r pipeline/requirements.txt
      - name: Installer Treg
        env: { TREG_TOKEN: "${{ secrets.TREG_TOKEN }}" }
        run: |
          curl -fsSL https://treg.to/install.sh | sh -s -- --token "$TREG_TOKEN" > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publier maintenant
        env:
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          PUBLISH_NOW: "1"
        run: |
          ID="${{ inputs.video_id }}"; F="${{ inputs.fichier }}"
          mkdir -p "pipeline/out/$ID" && cp "$F" "pipeline/out/$ID/final.mp4"
          cd pipeline
          python pipeline.py upload "$ID" || python treg_publish.py "$ID" "../$F" --now
          python social_publish.py "$ID" "../$F"
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -f pipeline/state.json
          git commit -m "Publication : ${{ inputs.video_id }}" || true
          git pull -q --rebase origin main || true
          git push
