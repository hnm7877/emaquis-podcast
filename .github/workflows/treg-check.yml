# Bouton manuel : vérifie le jeton Treg et les comptes connectés (ne publie rien)
name: Vérifier Treg
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Treg
        env:
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
        run: |
          if [ -z "$TREG_TOKEN" ]; then echo "❌ Secret TREG_TOKEN absent"; exit 1; fi
          curl -fsSL https://treg.to/install.sh | sh -s -- --token "$TREG_TOKEN" > /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Comptes connectés
        run: |
          treg --version
          treg connections ls
          treg balance || true
      - name: Format des appels de publication
        run: |
          treg catalog get facebook.facebook.page.video.create || true
          treg host --help || true
          treg catalog search "tiktok inbox upload video" || true
          treg catalog get tiktok.tiktok.video.inbox.init || true
          treg catalog get tiktok.tiktok.creator.info || true
