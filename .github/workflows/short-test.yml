# Bouton manuel : génère UN Short (HeyGen + sous-titres) SANS le publier, à télécharger pour vérifier.
name: Générer un Short de test
on:
  workflow_dispatch:
    inputs:
      short_id:
        description: "Identifiant du Short (voir pipeline/shorts.yaml)"
        default: "ep01-s1"
      heygen_video_id:
        description: "Optionnel : réutiliser une vidéo HeyGen déjà générée (pas de crédits consommés)"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-montserrat
      - run: pip install -r requirements.txt
      - name: Génération HeyGen
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          if [ -n "${{ inputs.heygen_video_id }}" ]; then
            python pipeline.py fetch "${{ inputs.short_id }}" "${{ inputs.heygen_video_id }}"
          else
            python pipeline.py generate "${{ inputs.short_id }}"
          fi
      - name: Sous-titres et habillage
        run: python pipeline.py brand "${{ inputs.short_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.short_id }}
          path: |
            pipeline/out/${{ inputs.short_id }}/final.mp4
            pipeline/out/${{ inputs.short_id }}/raw.mp4
