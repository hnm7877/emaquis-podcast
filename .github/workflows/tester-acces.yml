# Bouton manuel : Actions → « Tester les accès » → Run workflow
name: Tester les accès
on:
  workflow_dispatch:
    inputs:
      voix:
        description: "Nom de voix HeyGen à rechercher (optionnel)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vérification
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          VOICE_SEARCH: ${{ inputs.voix }}
        run: python check_setup.py
